# Create project and task (same scenario as web doc E2E).
#
# Prerequisites:
# - iOS Simulator (or device) with the dev client installed for this bundle id.
# - App built with native bundle id com.testdrivendocumentationdemo.mobile (not Expo Go).

appId: com.testdrivendocumentationdemo.mobile
---
# Open the app (cold start safe: short swipe after launch per Maestro + iOS notes).
- launchApp

- swipe:
    direction: DOWN
    duration: 100

# Wait until the splash is gone and the shell is interactive.
- extendedWaitUntil:
    visible:
      id: auth-loaded
    timeout: 15000

# If we are logged out, complete sign-in; if already logged in, this block is skipped.
- runFlow:
    when:
      visible:
        id: login-email-input
    file: flows/sign-in-guest.yaml

# We should land on the projects list with the top bar title "Projects".
- extendedWaitUntil:
    visible:
      id: projects-screen
    timeout: 10000

- assertVisible: Projects

# Start a new project from the top bar.
- tapOn:
    id: topbar-new-project

# Focus the project name field and enter the name Maestro will assert later.
- tapOn:
    id: new-project-name-input
- inputText: Website Redesign

- tapOn:
    id: new-project-create-button

- assertVisible: Website Redesign

# Navigate to the new project detail screen (title shows the project name).
- extendedWaitUntil:
    visible:
      id: project-detail-screen
    timeout: 10000

# Open the add-task form from the top bar.
- tapOn:
    id: topbar-add-task

- extendedWaitUntil:
    visible:
      id: task-name-input
    timeout: 10000

- tapOn:
    id: task-name-input
- inputText: Draft homepage layout

- hideKeyboard

- tapOn:
    id: task-assignee-bob

- assertVisible:
    id: task-assignee-bob
    selected: true

# Submit the task from the form action row.
- tapOn:
    id: task-form-submit-button

# Task row should show the title we just entered.
- extendedWaitUntil:
    visible: "Draft homepage layout"
    timeout: 10000

- assertVisible: "Draft homepage layout"
